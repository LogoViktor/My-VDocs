# ============================================================================
# Configuration de base pour Zensical - My VDocs
# Auteur : Victor P. (LogoViktor)
# ============================================================================

[project]
site_name = "My VDocs"
site_description = "Documentation technique — DHCP, NFS, AD, Cisco, et plus"
site_author = "Victor P."
copyright = """
Copyright &copy; 2026 <a href="https://github.com/LogoViktor" target="_blank" rel="noopener">LogoViktor</a>
"""

# ----------------------------------------------------------------------------
# Configuration du thème
# ----------------------------------------------------------------------------
[project.theme]
language = "fr"

# 1. Palette SOMBRE (Par défaut)
[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

# 2. Palette CLAIRE
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

# ----------------------------------------------------------------------------
# Fonctionnalités activées
# ----------------------------------------------------------------------------
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# ----------------------------------------------------------------------------
# Navigation du site (Noms propres et épurés pour tout le monde)
# ----------------------------------------------------------------------------
nav = [
    { "Accueil" = "index.md" },
    { "Notice" = [
        { "DHCP" = [
            { "Installation et configuration de base" = "Notice/DHCP/DHCP_base.md" },
            { "Relais DHCP" = "Notice/DHCP/DHCP_Relais.md" },
            { "Configuration VLAN" = "Notice/DHCP/DHCP_vlan.md" },
        ]},
        { "Services" = [
            { "Bind9" = "Notice/Services/dns.md" },
        ]},
        { "OSPF" = [
            { "OSPF" = "Notice/OSPF/ospf.md" },
            { "OSPFv3" = "Notice/OSPF/ospfv3.md" },
        ]},
        { "NFS / SAMBA" = [
            { "NFS" = "Notice/NFS_SAMBA/nfs.md" },
            { "SAMBA" = "Notice/NFS_SAMBA/samba.md" },
        ]},
        { "BGP/MPLS" = [
            { "BGP" = "Notice/BGP_MPLS/bgp.md" },
            { "MPLS" = "Notice/BGP_MPLS/mpls.md" },
        ]},
        { "Apache" = "Notice/apache.md" },
        { "Proxy Squid" = "Notice/proxysquid.md" },
        { "Supervision" = [
            { "Zabbix" = "Notice/Supervision/zabbix.md" },
        ]},
        { "Securite" = [
            { "pfSense" = "Notice/Securite/pfsense.md" },
        ]},
        { "Cloud" = [
            { "Docker" = "Notice/Cloud/docker.md" },
        ]},
        { "Active Directory" = [
            { "Installation et configuration de base" = "Notice/Active Directory/AD_base.md" },
            { "Utilisateurs et Groupes" = "Notice/Active Directory/AD_users.md" },
            { "GPO" = "Notice/Active Directory/AD_GPO.md" },
        ]},
        { "VPN" = [
            { "IPSec" = "Notice/VPN/ipsec.md" },
            { "OpenVPN" = "Notice/VPN/openvpn.md" },
            { "WireGuard" = "Notice/VPN/wireguard.md" },
        ]},
        { "VLAN" = [
            { "Routage Inter-VLAN" = "Notice/VLAN/routage_inter_vlan.md" },
            { "VLAN & Trunking 802.1Q" = "Notice/VLAN/vlan_trunking.md" },
        ]},
    ]},
    { "Guide" = [
        { "Commandes Switch/Routeur Cisco" = "Guide/commande_de_base_cisco.md" },
        { "Commandes Switch Alcatel" = "Guide/commandes_alcatel.md" },
        { "Git / Github" = "Guide/git_github.md" },
        { "Ansible" = "Guide/ansible.md" },
    ]},
]

# ----------------------------------------------------------------------------
# Configuration pour le mode hors ligne
# ----------------------------------------------------------------------------
[project.plugins.offline]
enabled = true

# ----------------------------------------------------------------------------
# Extensions Markdown (Configuration PyMdown)
# ----------------------------------------------------------------------------
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]