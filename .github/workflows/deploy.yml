name: Deploy to OVH SFTP

on:
  push:
    branches:
      - main # ou 'master' selon votre branche principale

jobs:
  web-deploy:
    name: Deploy Zensical Site
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      # Ici, on suppose que votre dossier 'site/' est déjà généré

      - name: Sync files to OVH via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "site/*"
          target: "www/"
          strip_components: 1 # Retire le dossier 'site/' parent pour ne copier que son contenu directement dans 'www/'
